# Despliegue en Render (https://render.com). Requiere plan de pago por el disco persistente.
services:
  - type: web
    name: stf-superliga
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: stf-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ADMIN_USER
        value: stf_director
      - key: ADMIN_PASSWORD
        sync: false   # se pide al crear el servicio; escribe una contraseña propia de 16+ caracteres
